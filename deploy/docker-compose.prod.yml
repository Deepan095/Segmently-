# ---------------------------------------------------------------------------
# Production overlay - integrates with an EXISTING Traefik reverse proxy
# (the Hostinger "Ubuntu + n8n" image ships Traefik on :80/:443).
#
#   docker compose -f docker-compose.yml -f deploy/docker-compose.prod.yml \
#     --env-file deploy/.env.prod up -d --build
#
#   * db / redis / worker            : internal only, no published ports
#   * web / api / minio              : reachable by Traefik on the shared
#                                      `edge` network + routed by labels
#   * TLS: Traefik's existing `mytlschallenge` (Let's Encrypt) resolver
#
# The external network name below must match the running Traefik's network.
# Check with:  docker inspect n8n-traefik-1 --format '{{json .NetworkSettings.Networks}}'
# ---------------------------------------------------------------------------

networks:
  edge:
    external: true
    name: n8n_default

services:
  db:
    ports: !reset []

  redis:
    ports: !reset []

  minio:
    command: server /data --address ":9000" --console-address "127.0.0.1:9001"
    ports: !reset []
    networks: [default, edge]
    labels:
      - traefik.enable=true
      - traefik.docker.network=n8n_default
      - "traefik.http.routers.segmently-s3.rule=Host(`s3.segmently.online`)"
      - traefik.http.routers.segmently-s3.entrypoints=web,websecure
      - traefik.http.routers.segmently-s3.tls=true
      - traefik.http.routers.segmently-s3.tls.certresolver=mytlschallenge
      - traefik.http.services.segmently-s3.loadbalancer.server.port=9000

  api:
    env_file:
      - deploy/.env.prod
    ports: !reset []
    networks: [default, edge]
    labels:
      - traefik.enable=true
      - traefik.docker.network=n8n_default
      - "traefik.http.routers.segmently-api.rule=Host(`segmently.online`) && (PathPrefix(`/api`) || Path(`/health`))"
      - traefik.http.routers.segmently-api.priority=100
      - traefik.http.routers.segmently-api.entrypoints=web,websecure
      - traefik.http.routers.segmently-api.tls=true
      - traefik.http.routers.segmently-api.tls.certresolver=mytlschallenge
      - traefik.http.services.segmently-api.loadbalancer.server.port=8000

  worker:
    env_file:
      - deploy/.env.prod
    volumes:
      # Drop a Netscape cookies.txt at deploy/cookies/youtube.txt to let yt-dlp
      # fetch YouTube from this datacenter IP. Optional - direct uploads and many
      # non-YouTube URLs work without it.
      - ./deploy/cookies:/cookies:ro
    deploy:
      resources:
        limits:
          cpus: "${WORKER_CPUS:-2}"

  web:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:?set VITE_API_URL in deploy/.env.prod}
    ports: !reset []
    networks: [default, edge]
    labels:
      - traefik.enable=true
      - traefik.docker.network=n8n_default
      # apex - its own cert, never coupled to www so www DNS can't block renewal
      - "traefik.http.routers.segmently-web.rule=Host(`segmently.online`)"
      - traefik.http.routers.segmently-web.priority=1
      - traefik.http.routers.segmently-web.entrypoints=web,websecure
      - traefik.http.routers.segmently-web.tls=true
      - traefik.http.routers.segmently-web.tls.certresolver=mytlschallenge
      - traefik.http.services.segmently-web.loadbalancer.server.port=8080
      # www -> apex redirect, separate router + cert.
      # Requires an `A www -> <VPS IP>` record (else Traefik burns Let's Encrypt
      # failed-auth rate limit retrying a missing name).
      - "traefik.http.routers.segmently-www.rule=Host(`www.segmently.online`)"
      - traefik.http.routers.segmently-www.priority=1
      - traefik.http.routers.segmently-www.entrypoints=web,websecure
      - traefik.http.routers.segmently-www.tls=true
      - traefik.http.routers.segmently-www.tls.certresolver=mytlschallenge
      - traefik.http.routers.segmently-www.service=segmently-web
      - traefik.http.routers.segmently-www.middlewares=segmently-www
      - "traefik.http.middlewares.segmently-www.redirectregex.regex=^https?://www\\.segmently\\.online/(.*)"
      - "traefik.http.middlewares.segmently-www.redirectregex.replacement=https://segmently.online/$${1}"
      - traefik.http.middlewares.segmently-www.redirectregex.permanent=true
