# ---------------------------------------------------------------------------
# Production overlay. Use together with the base file:
#
#   docker compose -f docker-compose.yml -f deploy/docker-compose.prod.yml \
#     --env-file deploy/.env.prod up -d --build
#
# Differences from the base stack:
#   * db / redis / minio are NOT published on host ports (internal only)
#   * api / web are NOT published either - Caddy is the only public entrypoint
#   * a Caddy service terminates TLS for segmently.online + s3.segmently.online
#   * MinIO console is disabled
# ---------------------------------------------------------------------------

services:
  db:
    ports: !reset []

  redis:
    ports: !reset []

  minio:
    command: server /data --address ":9000" --console-address "127.0.0.1:9001"
    ports: !reset []

  api:
    # Load the full production env (the base file only sets a handful of vars).
    env_file:
      - deploy/.env.prod
    ports: !reset []

  worker:
    env_file:
      - deploy/.env.prod
    # One render at a time keeps CPU predictable on a small VPS. Scale with
    #   docker compose ... up -d --scale worker=2
    deploy:
      resources:
        limits:
          cpus: "${WORKER_CPUS:-2}"

  web:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:?set VITE_API_URL in .env.prod}
    ports: !reset []

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - web
      - api
      - minio
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:?set SITE_DOMAIN in .env.prod}
      S3_DOMAIN: ${S3_DOMAIN:?set S3_DOMAIN in .env.prod}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in .env.prod}

volumes:
  caddy_data:
  caddy_config:
