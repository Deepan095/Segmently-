name: CI

on:
  push:
  pull_request:

jobs:
  backend-lint-test:
    name: Backend - ruff + pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: segmently
          POSTGRES_PASSWORD: segmently
          POSTGRES_DB: segmently
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U segmently"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://segmently:segmently@localhost:5432/segmently
      REDIS_URL: redis://localhost:6379/0
      SECRET_KEY: ci-secret
      STORAGE_ENDPOINT_URL: http://localhost:9000
      STORAGE_BUCKET: segmently-media
      STORAGE_ACCESS_KEY: minioadmin
      STORAGE_SECRET_KEY: minioadmin

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ruff
        run: ruff check .

      - name: Pytest
        run: pytest -q

  frontend:
    name: Frontend - lint + type-check + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run type-check

      - name: Build
        run: npm run build

  docker-build:
    name: Docker - compose build
    runs-on: ubuntu-latest
    needs: [backend-lint-test, frontend]

    steps:
      - uses: actions/checkout@v4

      - name: Validate compose config
        run: docker compose config

      - name: Build images
        run: docker compose build
